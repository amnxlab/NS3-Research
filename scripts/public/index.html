<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWSN Dashboard | Cyber-Terminal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0b;
            --panel: rgba(25, 25, 30, 0.7);
            --accent: #00f3ff;
            --neon-green: #00ff41;
            --text: #e0e0e0;
            --border: rgba(0, 243, 255, 0.3);
            --glow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 2px, 3px 100%;
            color: var(--text);
            font-family: 'JetBrains+Mono', monospace;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            text-shadow: var(--glow);
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--accent);
        }

        .card {
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .section-title {
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: "";
            height: 1px;
            flex-grow: 1;
            background: var(--border);
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Dynamic Field Styles */
        .field-row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .field-row input {
            flex-grow: 1;
        }

        .btn-mini {
            padding: 4px 8px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #555;
            color: var(--accent);
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mini:hover {
            background: rgba(0, 243, 255, 0.2);
        }

        .btn-add {
            margin-left: auto;
            font-size: 0.8rem;
            padding: 2px 6px;
            border: 1px solid var(--accent);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            overflow-y: auto;
        }

        .modal-content {
            margin: 5% auto;
            padding: 20px;
            width: 90%;
            max-width: 1200px;
            background: #111;
            border: 1px solid var(--accent);
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            color: var(--accent);
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--accent);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        .gallery-label {
            padding: 10px;
            text-align: center;
            color: #888;
            font-size: 0.8rem;
            border-top: 1px solid #222;
        }

        .no-graphs {
            text-align: center;
            padding: 50px;
            color: #555;
            font-style: italic;
        }

        label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        input,
        select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .protocol-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .checkbox-group input {
            cursor: pointer;
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            padding: 12px 24px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            box-shadow: var(--glow);
        }

        .btn-primary:hover {
            background: #fff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .btn-danger {
            background: #ff0055;
            color: white;
            display: none;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .console-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .console {
            flex-grow: 1;
            background: #000;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 15px;
            font-size: 0.8rem;
            line-height: 1.4;
            overflow-y: auto;
            max-height: 600px;
            min-height: 400px;
            color: var(--neon-green);
        }

        .console::-webkit-scrollbar {
            width: 8px;
        }

        .console::-webkit-scrollbar-thumb {
            background: #222;
        }

        .console-line {
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .status-bar {
            margin-top: 10px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            color: #555;
        }

        .loader {
            display: none;
            width: 15px;
            height: 15px;
            border: 2px solid var(--bg);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .tag {
            background: rgba(0, 243, 255, 0.1);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.65rem;
            margin-left: 5px;
        }

        .log-step {
            color: var(--accent);
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            margin-top: 10px;
            border-bottom: 1px dashed var(--accent);
            padding-bottom: 5px;
        }

        .log-success {
            color: var(--neon-green);
            font-weight: bold;
        }

        .log-error {
            color: #ff0055;
            font-weight: bold;
        }

        .log-info {
            color: #e0e0e0;
        }

        .log-dim {
            color: #555;
            font-size: 0.75rem;
        }

        .log-highlight {
            color: #ffae00;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>UWSN SIMULATION SYSTEM</h1>
        <p>Advanced Protocol Comparison & Network Lifetime Analytics</p>
    </header>

    <div class="container">
        <!-- Configuration Side -->
        <div class="card">
            <div class="section-title">Execution Profile</div>

            <label>Protocols <span style="color:red">*</span></label>
            <div class="protocol-selection">
                <label class="checkbox-group">
                    <input type="checkbox" name="protocol" value="VBF" checked> VBF
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" name="protocol" value="DBR" checked> DBR
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" name="protocol" value="flooding" checked> Flooding
                </label>
            </div>

            <div class="grid-row">
                <div class="input-group">
                    <label>Node Count <span class="tag">Sweep</span> <button class="btn-add"
                            onclick="addField('nodes')">+</button></label>
                    <div id="nodes">
                        <!-- Default Field -->
                        <div class="field-row">
                            <input type="text" value="100" class="val-nodes">
                        </div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Runs / Config</label>
                    <input type="number" id="runs" value="15">
                </div>
            </div>

            <div class="section-title">Network Parameters</div>
            <div class="grid-row">
                <div class="input-group">
                    <label>Sim Time (s) <span class="tag">Sweep</span> <button class="btn-add"
                            onclick="addField('simtime')">+</button></label>
                    <div id="simtime">
                        <div class="field-row"><input type="text" value="500" class="val-simtime"></div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Range (m) <span class="tag">Sweep</span> <button class="btn-add"
                            onclick="addField('range')">+</button></label>
                    <div id="range">
                        <div class="field-row"><input type="text" value="100" class="val-range"></div>
                    </div>
                </div>
            </div>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>Initial Energy (J) <span class="tag">Sweep</span> <button class="btn-add"
                        onclick="addField('initial_energy')">+</button></label>
                <div id="initial_energy">
                    <div class="field-row"><input type="text" value="500" class="val-initial_energy"></div>
                </div>
            </div>

            <div class="section-title">Advanced Setup</div>
            <div class="grid-row">
                <div class="input-group">
                    <label>Min Z (m) <button class="btn-add" onclick="addField('min_z')">+</button></label>
                    <div id="min_z">
                        <div class="field-row"><input type="text" value="0" class="val-min_z"></div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Max Z (m) <button class="btn-add" onclick="addField('max_z')">+</button></label>
                    <div id="max_z">
                        <div class="field-row"><input type="text" value="400" class="val-max_z"></div>
                    </div>
                </div>
            </div>
            <div class="grid-row">
                <div class="input-group">
                    <label>Area X (m) <button class="btn-add" onclick="addField('area_x')">+</button></label>
                    <div id="area_x">
                        <div class="field-row"><input type="text" value="400" class="val-area_x"></div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Area Y (m) <button class="btn-add" onclick="addField('area_y')">+</button></label>
                    <div id="area_y">
                        <div class="field-row"><input type="text" value="400" class="val-area_y"></div>
                    </div>
                </div>
            </div>
            <div class="grid-row">
                <div class="input-group">
                    <label>VBF Width (m) <button class="btn-add" onclick="addField('vbf_width')">+</button></label>
                    <div id="vbf_width">
                        <div class="field-row"><input type="text" value="100" class="val-vbf_width"></div>
                    </div>
                </div>
                <div class="input-group">
                    <label>Mobility</label>
                    <select id="mobility">
                        <option value="random">Random Walk</option>
                        <option value="fixed">Fixed</option>
                    </select>
                </div>
            </div>

            <div class="section-title">System Flags</div>
            <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
                <label class="checkbox-group">
                    <input type="checkbox" id="skip_build"> Skip Build
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="skip_analysis"> Skip Analysis
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="skip_plots"> Skip Plots
                </label>
            </div>

            <div class="actions">
                <button id="runBtn" class="btn btn-primary" style="flex-grow: 1;">
                    <span class="loader"></span>
                    Initiate Simulation
                </button>
                <button id="stopBtn" class="btn btn-danger">Abort</button>
            </div>
        </div>

        <!-- Terminal Side -->
        <div class="console-container">
            <div class="card" style="flex-grow: 1; display: flex; flex-direction: column;">
                <div class="section-title">System Console // Real-time Output</div>
                <div class="console" id="console">
                    <div class="console-line">> System initialized. Awaiting commands...</div>
                </div>
                <div class="status-bar">
                    <div>CPU READY // NS-3.42 DETECTED</div>
                    <div id="statusText">IDLE</div>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button onclick="openGallery()" class="btn btn-secondary"
                    style="width: 100%; display: flex; justify-content: center; gap: 10px;">
                    <span>📊</span> View Graphics Gallery
                </button>
            </div>
        </div>
    </div>

    <!-- Graph Modal -->
    <div id="graphModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 style="color: var(--accent); margin-bottom: 20px;">Visualization Gallery</h2>
            <div id="gallery" class="gallery-grid">
                <!-- Images injected here -->
            </div>
        </div>
    </div>

    <script>
        // Dynamic Input Logic
        function addField(containerId, defaultValue = "") {
            const container = document.getElementById(containerId);
            const row = document.createElement('div');
            row.className = 'field-row';

            const input = document.createElement('input');
            input.type = 'text';
            input.value = defaultValue;
            input.className = 'val-' + containerId; // Marker for collection

            const btnRemove = document.createElement('button');
            btnRemove.className = 'btn-mini';
            btnRemove.textContent = '×';
            btnRemove.onclick = () => row.remove();

            row.appendChild(input);
            row.appendChild(btnRemove);
            container.appendChild(row);
        }

        function getMultiValue(containerId) {
            const inputs = document.querySelectorAll(`.val-${containerId}`);
            return Array.from(inputs).map(i => i.value).filter(v => v.trim() !== "").join(',');
        }

        // Modal Logic
        const modal = document.getElementById("graphModal");
        const closeBtn = document.querySelector(".close-modal");

        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }

        async function openGallery() {
            modal.style.display = "block";
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '<div style="color:white; text-align:center; grid-column:1/-1;">Loading graphics...</div>';

            try {
                // Fetch list from API
                const response = await fetch('http://localhost:8081/list_graphs');
                const files = await response.json();

                gallery.innerHTML = '';

                if (files.length === 0) {
                    gallery.innerHTML = '<div class="no-graphs" style="grid-column:1/-1;">No graphs generated yet.<br>Run a simulation first!</div>';
                    return;
                }

                files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    // Use the static server (port 8000) to serve the actual image via the symlink
                    item.innerHTML = `
                        <a href="/graphs/${file}" target="_blank">
                            <img src="/graphs/${file}" loading="lazy" alt="${file}">
                        </a>
                        <div class="gallery-label">${file}</div>
                    `;
                    gallery.appendChild(item);
                });
            } catch (err) {
                gallery.innerHTML = `<div style="color:red; text-align:center; grid-column:1/-1;">Failed to load gallery: ${err.message}</div>`;
            }
        }

        const consoleEl = document.getElementById('console');
        const runBtn = document.getElementById('runBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const loader = document.querySelector('.loader'); // Corrected: only one loader declaration

        let msgSource = null;

        function connectStream() {
            if (msgSource) return; // Already connected

            msgSource = new EventSource('http://localhost:8081/stream');

            msgSource.onmessage = function (e) {
                const text = e.data;
                appendLog(text);

                if (text.includes("[FINISHED]") || text.includes("[ABORTED]")) {
                    setRunning(false);
                    // Don't close stream automatically, keep it for history viewing
                    // unless we want to stop updates. But server keeps stream open.
                } else if (text.includes("[STARTING]")) {
                    setRunning(true);
                }
            };

            msgSource.onerror = function (e) {
                // Connection lost? simple retry happens automatically by EventSource usually.
                // If persistent error, maybe server down.
                console.log("Stream skipped/error");
            };
        }

        function appendLog(text) {
            const line = document.createElement('div');
            line.className = 'console-line';
            line.style.whiteSpace = 'pre-wrap';
            line.textContent = text;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function setRunning(isRunning) {
            if (isRunning) {
                runBtn.disabled = true;
                stopBtn.disabled = false;
                runBtn.style.opacity = "0.5";
                stopBtn.style.opacity = "1";
                loader.style.display = "block";
                statusText.textContent = "SIMULATION RUNNING";
                statusText.style.color = "var(--neon-green)";
            } else {
                runBtn.disabled = false;
                stopBtn.disabled = true;
                runBtn.style.opacity = "1";
                stopBtn.style.opacity = "0.5";
                loader.style.display = "none";
                statusText.textContent = "READY";
                statusText.style.color = "#888";
            }
        }

        // On Load
        window.addEventListener('load', async () => {
            // Check status first
            try {
                const res = await fetch('http://localhost:8081/status');
                const data = await res.json();
                if (data.status === 'running') {
                    setRunning(true);
                }
            } catch (e) { console.log("Server not reachable"); }

            connectStream(); // Always listen
        });

        // Run Handler
        runBtn.addEventListener('click', async () => {
            consoleEl.innerHTML = '';

            const selectedProtocols = Array.from(document.querySelectorAll('input[name="protocol"]:checked')).map(cb => cb.value);
            if (selectedProtocols.length === 0) {
                alert("Please select at least one protocol!");
                return;
            }

            const data = {
                protocols: selectedProtocols,
                nodes: getMultiValue('nodes'),
                runs: document.getElementById('runs').value,
                simtime: getMultiValue('simtime'),
                range: getMultiValue('range'),
                initial_energy: getMultiValue('initial_energy'),
                min_z: getMultiValue('min_z'),
                max_z: getMultiValue('max_z'),
                area_x: getMultiValue('area_x'),
                area_y: getMultiValue('area_y'),
                vbf_width: getMultiValue('vbf_width'),
                mobility: document.getElementById('mobility').value,
                skip_build: document.getElementById('skip_build').checked,
                skip_analysis: document.getElementById('skip_analysis').checked,
                skip_plots: document.getElementById('skip_plots').checked
            };

            setRunning(true);

            try {
                // Fire and forget - connection via SSE will handle updates
                const res = await fetch('http://localhost:8081/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (!res.ok) { // Error
                    alert("Error: " + result.message);
                    setRunning(false);
                }
            } catch (err) {
                alert("Failed to start: " + err);
                setRunning(false);
            }
        });

        stopBtn.addEventListener('click', async () => {
            if (confirm("Abort current simulation?")) {
                try {
                    await fetch('http://localhost:8081/stop', { method: 'POST' });
                } catch (e) { alert(e); }
            }
        });
    </script>
</body>

</html>
